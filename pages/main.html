<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Vivant Watches - Login</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="authPage">

<div class="authCard">

<h2 class="authTitle">ATI</h2>
<p class="authSubtitle">Sign in to the invoice tool</p>

<form onsubmit="handleLogin(event)">

<label>Username</label>
<input type="text" id="loginUsername" required autofocus>

<label>Password</label>
<input type="password" id="loginPassword" required>

<div id="authMsg" class="authMsg"></div>

<button type="submit">Log In</button>

</form>

<p class="authLink">No account yet? <a href="register.html">Register</a></p>

</div>

</div>

<script src="../js/auth.js"></script>

</body>
</html>
