<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Vivant Watches - Register</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="authPage">

<div class="authCard">

<h2 class="authTitle">ATI</h2>
<p class="authSubtitle">Create an account</p>

<form onsubmit="handleRegister(event)">

<label>Username</label>
<input type="text" id="regUsername" required autofocus>

<label>Password</label>
<input type="password" id="regPassword" required>

<label>Confirm Password</label>
<input type="password" id="regConfirm" required>

<label>Company TRN</label>
<input type="text" id="regTRN" inputmode="numeric" maxlength="15" placeholder="15-digit Tax Registration Number" required oninput="this.value=this.value.replace(/\D/g,'')">

<label>Company Address</label>
<textarea id="regAddress" rows="2" placeholder="e.g. Shop #3, Al Dhagaya, Gold Souq, Deira, Dubai, UAE" required></textarea>

<label>Company Phone</label>
<input type="tel" id="regPhone" inputmode="tel" placeholder="+971 50 000 0000" required oninput="this.value=this.value.replace(/[^0-9+\-\s()]/g,'')">

<label>Company Email</label>
<input type="email" id="regEmail" placeholder="you@example.com" required>

<label>Your Logo</label>
<input type="file" id="regLogo" accept="image/*" required onchange="previewImage(this, 'logoPreview')">
<img id="logoPreview" class="uploadPreview" style="display:none;">

<label>Your Stamp</label>
<input type="file" id="regStamp" accept="image/*" required onchange="previewImage(this, 'stampPreview')">
<img id="stampPreview" class="uploadPreview" style="display:none;">

<div id="authMsg" class="authMsg"></div>

<button type="submit">Register</button>

</form>

<p class="authLink">Already have an account? <a href="login.html">Log In</a></p>

</div>

</div>

<script src="../js/auth.js"></script>
<script>
function previewImage(input, previewId){
	const preview = document.getElementById(previewId);
	if(input.files && input.files[0]){
		const reader = new FileReader();
		reader.onload = e => {
			preview.src = e.target.result;
			preview.style.display = "inline-block";
		};
		reader.readAsDataURL(input.files[0]);
	} else {
		preview.style.display = "none";
	}
}
</script>

</body>
</html>
