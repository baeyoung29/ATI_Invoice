<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 50% 40%, #1b1b1b 0%, #0c0c0c 45%, #050505 100%);
            color: #fff;
        }

        /* Background glow */
        .background-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            filter: blur(80px);
            animation: pulse 3s ease-in-out infinite;
        }

        /* Main loading container */
        .loader-container {
            position: relative;
            z-index: 2;
            width: min(90%, 420px);
            text-align: center;
            animation: fadeIn 0.8s ease forwards;
        }

        /* Logo / Brand */
        .logo {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 12px;
            text-transform: uppercase;

            background: linear-gradient(
                90deg,
                #ffffff,
                #aaaaaa,
                #ffffff
            );

            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: shine 2.5s linear infinite;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }

        /* Spinner */
        .spinner {
            width: 55px;
            height: 55px;
            margin: 0 auto 30px;

            border: 3px solid rgba(255, 255, 255, 0.12);
            border-top-color: #fff;
            border-radius: 50%;

            animation: spin 0.9s linear infinite;
        }

        /* Loading text */
        .loading-text {
            font-size: 13px;
            color: #aaa;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        /* Progress bar */
        .progress-wrapper {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(
                90deg,
                #666,
                #fff,
                #666
            );

            animation: loading 1.8s ease-in-out forwards;
        }

        /* Small status */
        .status {
            margin-top: 14px;
            font-size: 11px;
            color: #555;
            letter-spacing: 1px;
        }

        /* Animations */
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes loading {
            0% {
                width: 0%;
            }

            30% {
                width: 35%;
            }

            60% {
                width: 68%;
            }

            85% {
                width: 88%;
            }

            100% {
                width: 100%;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(0.9);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.1);
                opacity: 1;
            }
        }

        @keyframes shine {
            0% {
                background-position: 200% center;
            }

            100% {
                background-position: -200% center;
            }
        }

        /* Fade out before entering website */
        body.fade-out {
            animation: fadeOut 0.5s ease forwards;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        /* Mobile */
        @media (max-width: 500px) {
            .logo {
                font-size: 32px;
            }

            .subtitle {
                font-size: 11px;
            }

            .loader-container {
                width: 80%;
            }
        }
    </style>
</head>

<body>

    <div class="background-glow"></div>

    <main class="loader-container">

        <div class="logo">
            YOUR WEBSITE
        </div>

        <div class="subtitle">
            WELCOME
        </div>

        <div class="spinner"></div>

        <div class="loading-text">
            Loading
        </div>

        <div class="progress-wrapper">
            <div class="progress"></div>
        </div>

        <div class="status">
            Preparing your experience...
        </div>

    </main>

    <script>
        // Wait for the loading animation, then enter the main page
        setTimeout(() => {
            document.body.classList.add("fade-out");

            setTimeout(() => {
                window.location.href = "pages/main.html";
            }, 500);

        }, 1800);
    </script>

</body>
</html>
